name: Build Skell-Glitch VST3

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-dsp:
    name: Linux DSP regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure C++ DSP regression
        run: cmake -S . -B build-dsp -DCMAKE_BUILD_TYPE=Release -DSKELL_DSP_ONLY=ON
      - name: Compile DSP tests
        run: cmake --build build-dsp --parallel 2
      - name: Execute DSP tests
        run: ctest --test-dir build-dsp --output-on-failure --verbose

  windows-vst3:
    name: Skell-Glitch Windows VST3 + Standalone
    needs: source-and-dsp
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 8.0.10
          path: JUCE
      - uses: actions/checkout@v4
        with:
          repository: skellyruno/skellcore-vst-template
          ref: d02d50849123f28bbc2e32cded0e78aced15afb3
          path: SkellCoreSource
      - name: Configure JUCE
        shell: bash
        run: cmake -S . -B build -DJUCE_DIR="$GITHUB_WORKSPACE/JUCE" -DSKELLCORE_DIR="$GITHUB_WORKSPACE/SkellCoreSource" -DSKELL_BUILD_UI_SMOKE=ON
      - name: Compile VST3 + Standalone
        shell: bash
        run: cmake --build build --config Release --target SkellGlitch_VST3 SkellGlitch_Standalone SkellGlitchUISmoke --parallel 3
      - name: Compile Windows DSP test executable
        shell: bash
        run: cmake --build build --config Release --target skell_dsp_tests --parallel 2
      - name: Test DSP
        shell: bash
        run: ctest --test-dir build -C Release --output-on-failure --verbose
      - name: Render and validate offscreen UI at four window sizes
        shell: pwsh
        run: |
          $binary = Get-ChildItem build -Recurse -Filter SkellGlitchUISmoke.exe | Select-Object -First 1
          if (-not $binary) { throw "UI smoke executable not found" }
          & $binary.FullName
          if ($LASTEXITCODE -ne 0) { throw "UI smoke validation failed (exit $LASTEXITCODE)" }
      - name: Upload UI snapshots
        uses: actions/upload-artifact@v4
        with:
          name: Skell-Glitch-UI-Snapshots
          if-no-files-found: error
          path: build/ui-snapshots/**
      - name: Upload Windows plugin builds
        uses: actions/upload-artifact@v4
        with:
          name: Skell-Glitch-Windows-VST3-Standalone
          if-no-files-found: error
          path: |
            build/SkellGlitch_artefacts/Release/VST3/**
            build/SkellGlitch_artefacts/Release/Standalone/**
