name: Build VST3 Plugin

on:
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Configure CMake
      run: cmake -B build

    - name: Build Plugin Target
      run: cmake --build build --config Release --parallel

    # Package build outputs as downloadable artifacts
    - name: Upload Windows VST3 Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Skellgate-Windows-VST3
        path: build/Skellgate_artefacts/Release/VST3/

    - name: Upload Standalone Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Skellgate-Windows-Standalone
        path: build/Skellgate_artefacts/Release/Standalone/
