name: Build Skell-Glitch Windows VST3

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  source-and-dsp:
    name: Portable DSP and release-verifier tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Test Windows VST3 release verifier and preview archive
        run: python -m unittest discover -s tests -p "test_release_*.py" -v
      - name: Configure C++ DSP regression
        run: cmake -S . -B build-dsp -DCMAKE_BUILD_TYPE=Release -DSKELL_DSP_ONLY=ON
      - name: Compile DSP tests
        run: cmake --build build-dsp --parallel 2
      - name: Execute DSP tests
        run: ctest --test-dir build-dsp --output-on-failure --verbose

  windows-vst3:
    name: Windows x64 VST3 and real JUCE UI smoke
    needs: source-and-dsp
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - uses: actions/checkout@v7
        with:
          repository: juce-framework/JUCE
          ref: 8.0.12
          path: JUCE
      - uses: actions/checkout@v7
        with:
          repository: skellyruno/skellcore-vst-template
          ref: d02d50849123f28bbc2e32cded0e78aced15afb3
          path: SkellCoreSource
      - name: Configure JUCE and pinned SkellCore
        shell: bash
        run: cmake -S . -B build -DJUCE_DIR="$GITHUB_WORKSPACE/JUCE" -DSKELLCORE_DIR="$GITHUB_WORKSPACE/SkellCoreSource" -DSKELL_BUILD_UI_SMOKE=ON
      - name: Compile Windows VST3 and UI smoke target
        shell: bash
        run: cmake --build build --config Release --target SkellGlitch_VST3 SkellGlitchUISmoke --parallel 3
      - name: Compile Windows DSP test executable
        shell: bash
        run: cmake --build build --config Release --target skell_dsp_tests --parallel 2
      - name: Test DSP
        shell: bash
        run: ctest --test-dir build -C Release --output-on-failure --verbose
      - name: Render and validate offscreen UI at four window sizes
        shell: pwsh
        run: |
          $binary = Get-ChildItem build -Recurse -Filter SkellGlitchUISmoke.exe | Select-Object -First 1
          if (-not $binary) { throw "UI smoke executable not found" }
          & $binary.FullName
          if ($LASTEXITCODE -ne 0) { throw "UI smoke validation failed (exit $LASTEXITCODE)" }
      - name: Stage and verify the exact Windows VST3 package
        shell: pwsh
        run: |
          $bundle = Join-Path $env:GITHUB_WORKSPACE 'build/SkellGlitch_artefacts/Release/VST3/SkellGlitch.vst3'
          if (-not (Test-Path -LiteralPath $bundle -PathType Container)) { throw "Expected VST3 bundle not found: $bundle" }
          $standalone = Join-Path $env:GITHUB_WORKSPACE 'build/SkellGlitch_artefacts/Release/Standalone'
          if (Test-Path -LiteralPath $standalone -PathType Container) {
            $items = Get-ChildItem -LiteralPath $standalone -Force
            if ($items.Count -gt 0) { throw "Unexpected Standalone output exists in a VST3-only build" }
          }
          $package = Join-Path $env:GITHUB_WORKSPACE 'release-package'
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item -LiteralPath $bundle -Destination $package -Recurse
          $manifest = Join-Path $package 'release-manifest.json'
          $sourceSha = $env:GITHUB_SHA
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
            $event = Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json
            $sourceSha = [string]$event.pull_request.head.sha
          }
          python scripts/verify_windows_vst3.py (Join-Path $package 'SkellGlitch.vst3') --source-sha $sourceSha --manifest-out $manifest
          if ($LASTEXITCODE -ne 0) { throw "Windows VST3 package verification failed (exit $LASTEXITCODE)" }
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### Verified Windows VST3 package"
          Get-Content -LiteralPath $manifest | Add-Content -Path $env:GITHUB_STEP_SUMMARY
      - name: Validate packaged VST3 with pluginval
        uses: Tracktion/pluginval/validate@v2.0.0-beta3
        with:
          plugins: release-package/SkellGlitch.vst3
          strictness-level: 5
          pluginval-version: v2.0.0-beta3
      - name: Upload real JUCE UI snapshots
        uses: actions/upload-artifact@v7
        with:
          name: Skell-Glitch-UI-Snapshots
          if-no-files-found: error
          retention-days: 7
          path: build/ui-snapshots/**
      - name: Build deterministic private-preview ZIP and checksums
        shell: pwsh
        run: |
          Copy-Item -LiteralPath 'docs/WINDOWS-VST3-PRIVATE-PREVIEW.txt' -Destination 'release-package/WINDOWS-VST3-PRIVATE-PREVIEW.txt'
          Copy-Item -LiteralPath 'scripts/Install-SkellGlitchPreview.ps1' -Destination 'release-package/Install-SkellGlitchPreview.ps1'
          pwsh -NoLogo -NoProfile -File tests/Test-SkellGlitchPreviewInstaller.ps1 -InstallerPath 'release-package/Install-SkellGlitchPreview.ps1'
          if ($LASTEXITCODE -ne 0) { throw "Windows installer/update/rollback tests failed (exit $LASTEXITCODE)" }
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "Windows per-user installer, idempotent update, rollback and fail-closed package checks passed."
          python scripts/package_windows_vst3.py --package-dir release-package --output SkellGlitch-Windows-VST3-Preview-1.7.3.zip
          if ($LASTEXITCODE -ne 0) { throw "Private preview archive creation failed (exit $LASTEXITCODE)" }
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### Deterministic private-preview archive"
          Get-Content -LiteralPath 'SkellGlitch-Windows-VST3-Preview-1.7.3.zip.sha256' | Add-Content -Path $env:GITHUB_STEP_SUMMARY
      - name: Report product preview withheld for public repository
        if: github.event.repository.private != true
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "Product preview ZIP was built and validated but not uploaded because this repository is public. GitHub Actions artifacts from public repositories are publicly accessible, not private downloads."
      - name: Upload verified Windows VST3 preview archive (private repositories only)
        if: github.event.repository.private == true
        uses: actions/upload-artifact@v7
        with:
          name: Skell-Glitch-Windows-VST3-Preview
          if-no-files-found: error
          retention-days: 7
          path: |
            SkellGlitch-Windows-VST3-Preview-1.7.3.zip
            SkellGlitch-Windows-VST3-Preview-1.7.3.zip.sha256
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: Skell-Glitch-Windows-Diagnostics
          if-no-files-found: warn
          retention-days: 7
          path: |
            build/Testing/Temporary/LastTest.log
            build/ui-snapshots/**
            release-package/**
